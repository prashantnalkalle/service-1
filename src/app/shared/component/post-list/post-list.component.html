<div class="card h-100">
    <div class="card-header">
        <h2>
            {{postObj.title}}
        </h2>
    </div>
    <div class="card-body">
        <p>
            {{postObj.body}}
        </p>
    </div>
    <div class="card-footer d-flex justify-content-between">
        <button 
            (click)="onEdit()"
            mat-mini-fab 
            color="primary"
            >
            <mat-icon>edit</mat-icon>    
        </button>
        <button 
            (click)="onRemove()"
            mat-mini-fab
            color="warn"
            [disabled]="editId === postObj.id ">
            <mat-icon>delete</mat-icon>    
        </button>
    </div>
</div>
